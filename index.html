<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Paste</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 800px; }
        h1 { text-align: center; color: #f0f6fc; margin-bottom: 20px; }
        textarea { width: 100%; height: 300px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 15px; color: #e6edf3; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; line-height: 1.5; resize: vertical; outline: none; }
        textarea:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3); }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; flex-wrap: wrap; gap: 10px; }
        .size-info { font-size: 14px; color: #8b949e; }
        .size-info.warning { color: #d29922; }
        .size-info.danger { color: #f85149; }
        button { background: #238636; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background 0.2s; }
        button:hover { background: #2ea043; }
        button:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }
        .result { margin-top: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 20px; display: none; }
        .result.show { display: block; }
        .result-url { background: #0d1117; border: 1px solid #30363d; padding: 10px; border-radius: 6px; word-break: break-all; margin: 10px 0; font-family: monospace; color: #58a6ff; }
        .error { color: #f85149; margin-top: 10px; font-size: 14px; display: none; }
        .error.show { display: block; }
        .footer { text-align: center; margin-top: 40px; color: #8b949e; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minimal Paste</h1>
        <textarea id="paste-input" placeholder="Paste your text or code here..."></textarea>
        <div class="controls">
            <span id="size-info" class="size-info">0 B / 5 MiB</span>
            <button id="create-btn" onclick="createPaste()">CREATE PASTE</button>
        </div>
        <div id="error-msg" class="error"></div>
        
        <div id="result" class="result">
            <h3 style="margin-top: 0; color: #f0f6fc;">Paste Created Successfully!</h3>
            <p style="color: #8b949e; font-size: 14px;">Expires in 24 hours.</p>
            <div class="result-url" id="paste-url"></div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button onclick="copyUrl()">Copy Link</button>
                <button class="secondary" style="background: #21262d; border: 1px solid #30363d;" onclick="openRaw()">Open Raw</button>
                <button class="secondary" style="background: #21262d; border: 1px solid #30363d;" onclick="resetForm()">New Paste</button>
            </div>
        </div>
        
        <div class="footer">Deletes after 24h automatically. No accounts, no uploads.</div>
    </div>

    <script>
        const MAX_BYTES = 5 * 1024 * 1024;
        const input = document.getElementById('paste-input');
        const sizeInfo = document.getElementById('size-info');
        const createBtn = document.getElementById('create-btn');
        const errorMsg = document.getElementById('error-msg');
        const result = document.getElementById('result');
        const pasteUrl = document.getElementById('paste-url');
        let currentUrl = '';

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KiB', 'MiB', 'GiB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        input.addEventListener('input', () => {
            const blob = new Blob([input.value]);
            const size = blob.size;
            sizeInfo.textContent = formatBytes(size) + ' / 5 MiB';
            
            sizeInfo.classList.remove('warning', 'danger');
            if (size > MAX_BYTES) {
                sizeInfo.classList.add('danger');
            } else if (size > MAX_BYTES * 0.8) {
                sizeInfo.classList.add('warning');
            }
        });

        async function createPaste() {
            const content = input.value;
            if (!content || content.trim().length === 0) {
                showError("Paste cannot be empty.");
                return;
            }

            const blob = new Blob([content]);
            if (blob.size > MAX_BYTES) {
                showError("Payload too large. Maximum size is 5 MiB.");
                return;
            }

            createBtn.disabled = true;
            createBtn.textContent = "CREATING...";
            errorMsg.classList.remove('show');
            result.classList.remove('show');

            try {
                const response = await fetch('/api/paste', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });

                const data = await response.json();

                if (!response.ok || !data.ok) {
                    throw new Error(data.error || "Failed to create paste");
                }

                currentUrl = data.url;
                pasteUrl.textContent = window.location.origin + data.url;
                result.classList.add('show');
                input.value = '';
                sizeInfo.textContent = '0 B / 5 MiB';

            } catch (err) {
                showError(err.message || "Network error. Please try again.");
            } finally {
                createBtn.disabled = false;
                createBtn.textContent = "CREATE PASTE";
            }
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
        }

        function copyUrl() {
            navigator.clipboard.writeText(window.location.origin + currentUrl).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = "COPIED!";
                setTimeout(() => btn.textContent = originalText, 2000);
            }).catch(() => {
                showError("Failed to copy to clipboard.");
            });
        }

        function openRaw() {
            window.open(window.location.origin + currentUrl.replace('/p/', '/raw/'), '_blank');
        }

        function resetForm() {
            result.classList.remove('show');
            errorMsg.classList.remove('show');
            input.focus();
        }
    </script>
</body>
</html>
